services:
  postgres:
    image: postgres:17
    container_name: niched-postgres
    environment:
      POSTGRES_USER: niched
      POSTGRES_PASSWORD: niched
      POSTGRES_DB: niched
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: niched-backend
    environment:
      DATABASE_URL: postgresql+psycopg://niched:niched@postgres:5432/niched
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: